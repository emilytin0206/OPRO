project:
  log_dir: './logs'

dataset:
  name: 'mmlu'
  split: 'test'
  # 這裡會被展開為 subsets: ['math','physics','...']
  subsets: ['high_school_mathematics','high_school_chemistry','high_school_physics','high_school_world_history','business_ethics'] 
  train_limit: 100
  data_root: './data'
  shuffle: true

scorer_model:
  client_type: 'Ollama'
  model_name: 'qwen2.5:7b'
  api_url: 'http://localhost:11434/api/chat'
  temperature: 0.0
  max_output_tokens: 1024

optimizer_model:
  client_type: 'Ollama'
  model_name: 'qwen2.5:32b'
  api_url: 'http://localhost:11434/api/chat'
  temperature: 1.0
  max_output_tokens: 2048

optimization:
  num_iterations: 50
  num_prompts_to_generate: 8
  max_num_instructions_in_prompt: 20
  meta_prompt_path: 'prompt/meta_prompt.txt'
  eval_interval: 5
  instruction_pos: 'Q_begin'
  is_instruction_tuned: true
  num_few_shot_questions: 3
  few_shot_selection_criteria: 'random'
  initial_instructions:
    - "Let's think step by step."
    - "Answer the question directly."
    - "Solve this problem carefully."
