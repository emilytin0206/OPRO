# ----------------------------------------------------
# 專案設定
# ----------------------------------------------------
project:
  log_dir: './logs'

# ----------------------------------------------------
# 資料集設定 (針對 Revisiting OPRO 論文實驗)
# ----------------------------------------------------
dataset:
  name: 'gsm8k'
  split: 'train'
  data_root: './data'
  shuffle: true
  subsets: null

  # [修正 1] 論文 Appendix A.2 指出每次迭代取 3.5% 訓練集
  # GSM8K 訓練集總數 7473 * 3.5% ≈ 262
  train_limit: 262

# ----------------------------------------------------
# Scorer Model (評分模型)
# ----------------------------------------------------
scorer_model:
  client_type: 'Ollama'
  model_name: 'llama2:7b'   # 可依您的設備維持使用 Qwen 或更換為 Llama-2
  api_url: 'http://localhost:11434/api/chat'
  temperature: 0.0
  max_output_tokens: 1024

# ----------------------------------------------------
# Optimizer Model (優化器模型)
# ----------------------------------------------------
optimizer_model:
  client_type: 'Ollama'
  model_name: 'llama2:7b'
  api_url: 'http://localhost:11434/api/chat'
  temperature: 1.0           # OPRO 論文標準設定
  max_output_tokens: 2048

# ----------------------------------------------------
# OPRO 優化參數
# ----------------------------------------------------
optimization:
  train_ratio: 0.8
  eval_interval: 3
  
  # [修正 2] 論文 Appendix A.2 明確指出實驗跑 100 個迭代
  num_iterations: 100
  
  # [確認正確] 論文 Appendix A.2 指出每次生成 8 個新指令
  num_prompts_to_generate: 8
  
  # [確認正確] 論文 Appendix A.2 指出 Meta-prompt 包含 Top 20 歷史紀錄
  max_num_instructions_in_prompt: 20
  
  # 對應論文 Text 4 的 Meta-prompt (請確認檔案內容已更新)
  meta_prompt_path: 'prompt/meta_prompt.txt'
  
  # 指令位置：答案開頭 (符合論文 "instruction at the beginning of the answer")
  instruction_pos: 'A_begin' 
  
  is_instruction_tuned: true
  
  # [確認正確] 論文 Appendix A.2 指出 Meta-prompt 包含 3 個隨機範例
  num_few_shot_questions: 3
  
  few_shot_selection_criteria: 'random'
  old_instruction_score_threshold: 0.1

  # 初始指令：適合接在 "A: " 後面的起始句
  initial_instructions:
    - "Let's think step by step"
    - ""
